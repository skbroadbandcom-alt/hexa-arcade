<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  @font-face { font-family: "Press Start 2P"; src: url("fonts/PressStart2P-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Do Hyeon"; src: url("fonts/DoHyeon-Regular.ttf") format("truetype"); font-display: swap; }
  *, *::before, *::after { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
<title>추억의 헥사</title>
<meta name="theme-color" content="#0b0a1a">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Layout: one-screen arcade cabinet — marquee HUD on top, CRT well in the middle, control panel at the bottom. Single dark look by design. */
  :root {
    --cabinet: #0b0a1a;
    --panel: #17142e;
    --bezel: #2a2550;
    --screen: #05040c;
    --ink: #f3eedc;
    --dim: #8f88b8;
    --marquee: #ffcf3a;
    --btn-a: #e8344e;
    --btn-b: #ffcf3a;
    --btn-dir: #3a3470;
    --font-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --font-ko: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--cabinet);
    color: var(--ink);
    font-family: var(--font-ko);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding-inline: 12px;
    padding-block: 8px;
    box-sizing: border-box;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .credit { font-family: var(--font-pixel); font-size: 9px; color: var(--dim); letter-spacing: .08em; }
  .credit b { color: var(--marquee); font-weight: normal; }
  #exitBtn {
    min-height: 32px; padding: 4px 14px;
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--btn-a); border-radius: 6px;
    font-family: var(--font-ko); font-size: 16px; cursor: pointer;
  }

  /* ---------- HUD ---------- */
  .hud { display: flex; gap: 8px; align-items: stretch; }
  .stats {
    flex: 1; min-width: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
    background: var(--panel); border: 2px solid var(--bezel); border-radius: 6px;
    padding: 8px 10px;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lbl { font-family: var(--font-pixel); font-size: 8px; letter-spacing: .08em; color: var(--dim); }
  .val { font-family: var(--font-pixel); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #score { color: var(--marquee); }
  .nextbox {
    width: 76px; flex: none;
    background: var(--panel); border: 2px solid var(--bezel); border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px;
  }
  #next { width: 60px; height: 50px; }
  .sysbtns { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .sys {
    width: 44px; flex: 1; min-height: 36px;
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--bezel); border-radius: 6px;
    font-family: var(--font-pixel); font-size: 10px; cursor: pointer;
  }
  .sys[aria-pressed="false"] { color: var(--dim); }
  #pauseBtn {
    width: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: var(--btn-dir); border-color: var(--marquee); color: var(--marquee);
    font-family: var(--font-ko); font-size: 13px;
  }
  #pauseBtn .ico { font-family: var(--font-pixel); font-size: 12px; }
  #pauseBtn.paused { background: var(--marquee); color: #2a1d00; }
  #pauseBtn:disabled { opacity: .45; }
  #soundBtn { width: 64px; }

  /* ---------- Screen ---------- */
  .well {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .screen {
    position: relative;
    background: var(--screen);
    border: 3px solid var(--bezel);
    border-radius: 4px;
    box-shadow: 0 0 0 4px var(--panel), 0 0 28px rgba(120, 100, 255, .18);
    touch-action: none;
  }
  #board { display: block; }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(5, 4, 12, .82);
    text-align: center; padding: 12px;
  }
  .logo {
    font-family: var(--font-pixel); font-size: clamp(16px, 6vw, 24px); line-height: 1.5;
    color: var(--marquee); text-shadow: 3px 3px 0 var(--btn-a);
  }
  .sub { font-size: 18px; color: var(--ink); }
  .blink { font-family: var(--font-pixel); font-size: 10px; color: var(--ink); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .help { font-size: 15px; line-height: 1.5; color: var(--dim); }
  .start {
    font-family: var(--font-ko); font-size: 22px;
    background: var(--btn-a); color: var(--ink);
    border: none; border-radius: 6px; padding: 10px 22px;
    box-shadow: 0 5px 0 #8f1427; cursor: pointer;
  }
  .start:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f1427; }
  .start.alt { background: var(--btn-dir); box-shadow: 0 5px 0 #1d1940; }
  .tag { font-size: 22px; color: var(--btn-a); letter-spacing: .1em; }
  .logo-ko {
    font-family: var(--font-ko); font-size: clamp(36px, 12vw, 52px); line-height: 1.1;
    color: var(--marquee); text-shadow: 3px 3px 0 var(--btn-a), 6px 6px 0 rgba(0,0,0,.6);
  }
  .logo-ko.intro { animation: drop .7s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes drop { from { transform: translateY(-60px) scale(.8); } }
  .coin {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-ko); font-size: 20px;
    background: var(--btn-dir); color: var(--ink);
    border: none; border-radius: 6px; padding: 8px 18px;
    box-shadow: 0 5px 0 #1d1940; cursor: pointer;
  }
  .coin:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d1940; }
  .coin .c {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 35%, #f4f6fa, #a3a9b6);
    border: 2px solid #6d7280; color: #3a3f4a;
    font-family: var(--font-pixel); font-size: 7px;
  }
  .final { font-family: var(--font-pixel); font-size: 12px; line-height: 2; color: var(--ink); }
  .final b { color: var(--marquee); font-weight: normal; }

  /* ---------- Control panel ---------- */
  .pad {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--panel); border: 2px solid var(--bezel); border-radius: 10px;
    padding: 12px 14px;
    touch-action: none;
  }
  /* Direction keys stretch to fill the row (the colour-swap key sits at the far right), so both thumbs reach them easily */
  .dir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .dir .key:not(.round) { flex: 1; width: auto; height: 64px; font-size: 24px; }
  .key {
    width: 58px; height: 58px; border-radius: 10px;
    background: var(--btn-dir); color: var(--ink);
    border: none; box-shadow: 0 5px 0 #1d1940;
    font-size: 22px; cursor: pointer; touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  .round {
    flex: none;
    width: 66px; height: 66px; border-radius: 50%;
    flex-direction: column; gap: 2px;
    font-family: var(--font-ko); font-size: 15px;
  }
  .round small { font-family: var(--font-pixel); font-size: 9px; opacity: .8; }
  .key.a { background: var(--btn-a); box-shadow: 0 5px 0 #8f1427; }
  .key.on { transform: translateY(4px); box-shadow: 0 1px 0 #1d1940; }
  .key.a.on { box-shadow: 0 1px 0 #8f1427; }
  button:focus-visible { outline: 3px solid var(--marquee); outline-offset: 2px; }
  @media (max-width: 360px) {
    .key { width: 50px; height: 50px; }
    .dir .key:not(.round) { height: 58px; }
    .round { width: 58px; height: 58px; }
  }
  @media (prefers-reduced-motion: reduce) { .blink, .logo-ko.intro { animation: none; } }
</style>

<div id="app">
  <div class="topbar">
    <span class="credit">CREDIT <b id="credit">0</b></span>
    <button id="exitBtn" aria-label="게임 종료">✕ 종료</button>
  </div>
  <header class="hud">
    <div class="stats">
      <div class="stat"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
      <div class="stat"><span class="lbl">HI-SCORE</span><span class="val" id="hi">0</span></div>
      <div class="stat"><span class="lbl">LEVEL</span><span class="val" id="level">1</span></div>
      <div class="stat"><span class="lbl">JEWELS</span><span class="val" id="jewels">0</span></div>
    </div>
    <div class="nextbox"><span class="lbl">NEXT</span><canvas id="next"></canvas></div>
    <div class="sysbtns">
      <button class="sys" id="pauseBtn" aria-label="일시정지" disabled><span class="ico">II</span><span class="txt">멈춤</span></button>
      <button class="sys" id="soundBtn" aria-label="소리" aria-pressed="true">♪</button>
    </div>
  </header>

  <main class="well" id="well">
    <div class="screen" id="screen">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="tag">너구리용</div>
        <div class="logo-ko intro">추억의<br>헥사</div>
        <div class="blink">LOADING...</div>
      </div>
    </div>
  </main>

  <footer class="pad">
    <div class="dir">
      <button class="key" data-act="left" aria-label="왼쪽">◀</button>
      <button class="key" data-act="down" aria-label="아래">▼</button>
      <button class="key" data-act="right" aria-label="오른쪽">▶</button>
      <button class="key round a" data-act="rotate" aria-label="색 바꾸기">바꾸기<small>A</small></button>
    </div>
  </footer>
</div>

<script>
(() => {
  // A column of three jewels falls into a 6×13 well; line up 3+ of a colour in any direction
  const COLS = 6, ROWS = 13, HIDDEN = 3, H = ROWS + HIDDEN, LEN = 3;
  const MAGIC = 7;

  // 1 red, 2 yellow, 3 cyan, 4 magenta, 5 green, 6 blue
  const COLORS = [null, '#e8344e', '#ffcf3a', '#33d6e8', '#d856e0', '#5ad05a', '#4a6cf0'];
  // ms per row, by level
  const GRAVITY = [850,760,670,590,510,440,370,310,250,200,160,130,110,95,85,75,65,58,52,46];
  const LOCK_MS = 450, MAX_RESETS = 12, CLEAR_MS = 420;
  const JEWELS_PER_LEVEL = 30, MAGIC_EVERY = 60;
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  const $ = id => document.getElementById(id);
  const board = $('board'), bctx = board.getContext('2d');
  const nextC = $('next'), nctx = nextC.getContext('2d');
  const overlay = $('overlay');

  let grid, piece, next;
  let score = 0, jewels = 0, level = 1, hi = 0;
  let state = 'title';
  let dropTimer = 0, lockTimer = 0, resets = 0, softDrop = false;
  let clearCells = [], clearTimer = 0, chain = 0, magicDue = 0;
  let popup = null;
  let cell = 24;

  try { hi = parseInt(localStorage.getItem('hexaArcadeHi') || '0', 10) || 0; } catch (e) {}

  /* ---------- pieces ---------- */
  const rnd = () => 1 + Math.floor(Math.random() * 6);

  function makeNext() {
    if (magicDue > 0) { magicDue--; return { c: [MAGIC, MAGIC, MAGIC], magic: true }; }
    return { c: [rnd(), rnd(), rnd()], magic: false };
  }

  function collide(x, y) {
    if (x < 0 || x >= COLS) return true;
    for (let i = 0; i < LEN; i++) {
      const r = y + i;
      if (r >= H) return true;
      if (r >= 0 && grid[r][x]) return true;
    }
    return false;
  }

  function spawn() {
    const n = next;
    next = makeNext();
    // Bottom jewel starts on the first visible row
    piece = { c: n.c.slice(), magic: n.magic, x: 2, y: HIDDEN - LEN + 1 };
    dropTimer = 0; lockTimer = 0; resets = 0;
    if (collide(piece.x, piece.y)) gameOver();
    drawNext();
  }

  function grounded() { return collide(piece.x, piece.y + 1); }

  function afterMove() {
    if (grounded() && resets < MAX_RESETS) { lockTimer = 0; resets++; }
  }

  function move(dx) {
    if (state !== 'play') return false;
    if (!collide(piece.x + dx, piece.y)) {
      piece.x += dx; afterMove(); sfx('move'); return true;
    }
    return false;
  }

  // Shifts the jewel order: bottom goes to the top (or the reverse)
  function rotate(dir = 1) {
    if (state !== 'play' || piece.magic) return;
    const c = piece.c;
    piece.c = dir > 0 ? [c[2], c[0], c[1]] : [c[1], c[2], c[0]];
    afterMove(); sfx('rotate');
  }

  function stepDown(manual) {
    if (state !== 'play') return false;
    if (!grounded()) {
      piece.y++;
      if (manual) score += 1;
      lockTimer = 0;
      return true;
    }
    return false;
  }

  function hardDrop() {
    if (state !== 'play') return;
    let n = 0;
    while (!grounded()) { piece.y++; n++; }
    score += n * 2;
    sfx('drop'); buzz(15);
    lock();
  }

  function lock() {
    const { c, x, y, magic } = piece;
    piece = null;
    chain = 0;
    if (magic) {
      // The magic column wipes out every jewel of the colour it lands on
      const below = y + LEN < H ? grid[y + LEN][x] : 0;
      clearCells = [];
      if (below) {
        for (let r = 0; r < H; r++) for (let cc = 0; cc < COLS; cc++)
          if (grid[r][cc] === below) clearCells.push([r, cc]);
      }
      if (clearCells.length) {
        chain = 1;
        popup = { text: 'MAGIC!', t: 0 };
        state = 'clear'; clearTimer = 0;
        sfx('magic'); buzz(60);
      } else {
        sfx('lock');
        spawn();
      }
      updateHud();
      return;
    }
    for (let i = 0; i < LEN; i++) if (y + i >= 0) grid[y + i][x] = c[i];
    sfx('lock');
    resolve();
    updateHud();
  }

  function findMatches() {
    const hit = new Set();
    for (let r = 0; r < H; r++)
      for (let c = 0; c < COLS; c++) {
        const v = grid[r][c];
        if (!v) continue;
        for (const [dr, dc] of DIRS) {
          const pr = r - dr, pc = c - dc;
          // Only count from the start of a run
          if (pr >= 0 && pr < H && pc >= 0 && pc < COLS && grid[pr][pc] === v) continue;
          let n = 1;
          while (true) {
            const nr = r + dr * n, nc = c + dc * n;
            if (nr < 0 || nr >= H || nc < 0 || nc >= COLS || grid[nr][nc] !== v) break;
            n++;
          }
          if (n >= 3) for (let k = 0; k < n; k++) hit.add((r + dr * k) * COLS + (c + dc * k));
        }
      }
    return [...hit].map(i => [Math.floor(i / COLS), i % COLS]);
  }

  // Clears matches, then checks again after jewels fall — each extra round is a chain
  function resolve() {
    clearCells = findMatches();
    if (clearCells.length) {
      chain++;
      if (chain >= 2) popup = { text: chain + ' CHAIN!', t: 0 };
      state = 'clear'; clearTimer = 0;
      sfx('clear'); buzz(chain >= 2 ? 50 : 25);
      return;
    }
    state = 'play';
    for (let r = 0; r < HIDDEN; r++)
      if (grid[r].some(v => v)) { gameOver(); return; }
    spawn();
  }

  function finishClear() {
    for (const [r, c] of clearCells) grid[r][c] = 0;
    const n = clearCells.length;
    score += n * 10 * level * chain + (chain >= 2 ? 50 * chain * chain : 0);
    const before = jewels;
    jewels += n;
    if (Math.floor(jewels / MAGIC_EVERY) > Math.floor(before / MAGIC_EVERY)) magicDue = 1;
    const newLevel = Math.min(20, Math.floor(jewels / JEWELS_PER_LEVEL) + 1);
    if (newLevel > level) { level = newLevel; sfx('level'); }
    clearCells = [];
    // Let the jewels above fall into the gaps
    for (let c = 0; c < COLS; c++) {
      let w = H - 1;
      for (let r = H - 1; r >= 0; r--) {
        if (grid[r][c]) { const v = grid[r][c]; grid[r][c] = 0; grid[w][c] = v; w--; }
      }
    }
    resolve();
    updateHud();
  }

  /* ---------- game flow ---------- */
  let credits = 0, splash = true, lastResult = null;

  function newGame() {
    if (credits < 1) return;
    credits--; updateCredit();
    mIdx = 0; bassEighth = 0;
    grid = Array.from({ length: H }, () => Array(COLS).fill(0));
    score = 0; jewels = 0; level = 1; magicDue = 0; chain = 0; popup = null;
    next = makeNext();
    state = 'play';
    overlay.hidden = true;
    spawn();
    updateHud();
    audioInit(); musicStart();
    wake();
  }

  function gameOver() {
    state = 'over';
    musicStop(); sfx('over'); buzz(200);
    lastResult = { score, jewels, level, best: saveHi() };
    showTitle();
    updateHud();
  }

  function saveHi() {
    if (score <= hi) return false;
    hi = score;
    try { localStorage.setItem('hexaArcadeHi', String(hi)); } catch (e) {}
    return true;
  }

  // Title / game-over screen: insert a coin, then push start
  function showTitle() {
    splash = false;
    const r = lastResult;
    const head = r
      ? `<div class="logo">GAME<br>OVER</div>
         <div class="final">SCORE <b>${r.score.toLocaleString()}</b><br>JEWELS <b>${r.jewels}</b> · LV <b>${r.level}</b></div>
         ${r.best ? '<div class="sub">최고 기록 달성!</div>' : ''}`
      : `<div class="tag">너구리용</div><div class="logo-ko">추억의<br>헥사</div>`;
    const go = credits
      ? `<div class="blink">PUSH START</div><button class="start" data-start>▶ 게임 시작</button>`
      : `<div class="blink">${r ? 'CONTINUE? INSERT COIN' : 'INSERT COIN'}</div>`;
    showOverlay(`${head}
      <div class="final">CREDIT <b>${credits}</b></div>
      ${go}
      <button class="coin" data-coin><span class="c">100</span>동전 넣기</button>
      ${r ? '' : '<div class="help">같은 색 보석 3개를 가로·세로·대각선으로!<br>화면 탭: 색 바꾸기 · 좌우 드래그: 이동<br>아래로 드래그: 천천히 · 빠르게 튕기기: 바로 낙하</div>'}`);
  }

  function insertCoin() {
    audioInit();
    credits = Math.min(9, credits + 1);
    sfx('coin'); buzz(20);
    updateCredit();
    if (state === 'title' || state === 'over') showTitle();
  }
  function updateCredit() { $('credit').textContent = credits; }

  // Ends the current game and returns to the title screen
  function goTitle() {
    musicStop();
    if (grid) saveHi();
    state = 'title'; grid = null; piece = null; clearCells = []; lastResult = null; popup = null;
    score = 0; jewels = 0; level = 1; next = null; softDrop = false;
    drawNext(); updateHud();
    showTitle();
  }

  function askExit() {
    if (state === 'play' || state === 'clear') pause();
    showOverlay(`
      <div class="logo">EXIT?</div>
      <div class="sub">게임을 종료할까요?</div>
      <button class="start" data-exit-yes>종료하기</button>
      <button class="start alt" data-exit-no>취소</button>`);
  }
  function exitGame() {
    musicStop();
    if (grid) saveHi();
    // Inside the Android app this closes the app; on the web it returns to the title screen
    if (window.Android && typeof window.Android.exitApp === 'function') { window.Android.exitApp(); return; }
    goTitle();
  }

  function pause() {
    if (state === 'play' || state === 'clear') {
      state = 'pause:' + state;
      musicStop();
      showPauseOverlay();
      softDrop = false;
      paintPause();
    } else if (state.startsWith('pause:')) {
      resume();
    }
  }
  function showPauseOverlay() {
    showOverlay(`
      <div class="logo">PAUSE</div>
      <div class="sub">잠시 멈춤</div>
      <button class="start" data-resume>▶ 계속하기</button>
      <button class="start alt" data-title>처음 화면으로</button>`);
  }
  function resume() {
    if (!state.startsWith('pause:')) return;
    state = state.split(':')[1];
    overlay.hidden = true;
    last = performance.now();
    musicStart();
    paintPause();
  }

  function showOverlay(html) { overlay.innerHTML = html; overlay.hidden = false; }

  function paintPause() {
    const btn = $('pauseBtn');
    const paused = state.startsWith('pause:');
    btn.disabled = !(paused || state === 'play' || state === 'clear');
    btn.classList.toggle('paused', paused);
    btn.querySelector('.ico').textContent = paused ? '▶' : 'II';
    btn.querySelector('.txt').textContent = paused ? '계속' : '멈춤';
    btn.setAttribute('aria-label', paused ? '계속하기' : '일시정지');
  }

  overlay.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-start]')) newGame();
    else if (t.closest('[data-coin]')) insertCoin();
    else if (t.closest('[data-resume]')) resume();
    else if (t.closest('[data-title]')) goTitle();
    else if (t.closest('[data-exit-yes]')) exitGame();
    else if (t.closest('[data-exit-no]')) { if (state.startsWith('pause:')) showPauseOverlay(); else showTitle(); }
    else if (splash) showTitle();
  });
  $('exitBtn').addEventListener('click', askExit);

  function updateHud() {
    paintPause();
    $('score').textContent = score.toLocaleString();
    $('hi').textContent = Math.max(hi, score).toLocaleString();
    $('level').textContent = level;
    $('jewels').textContent = jewels;
  }

  /* ---------- drawing ---------- */
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }

  function hexPath(ctx, cx, cy, w, h) {
    const cut = w * .28;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy);
    ctx.lineTo(cx - w / 2 + cut, cy - h / 2);
    ctx.lineTo(cx + w / 2 - cut, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy);
    ctx.lineTo(cx + w / 2 - cut, cy + h / 2);
    ctx.lineTo(cx - w / 2 + cut, cy + h / 2);
    ctx.closePath();
  }

  // A faceted hexagon jewel filling one cell
  function gem(ctx, x, y, s, color) {
    const cx = x + s / 2, cy = y + s / 2, w = s * .92, h = s * .86;
    hexPath(ctx, cx, cy, w, h);
    ctx.fillStyle = shade(color, -.4); ctx.fill();
    // upper facets catch the light
    const cut = w * .28;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy);
    ctx.lineTo(cx - w / 2 + cut, cy - h / 2);
    ctx.lineTo(cx + w / 2 - cut, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy);
    ctx.closePath();
    ctx.fillStyle = shade(color, .35); ctx.fill();
    hexPath(ctx, cx, cy, w * .58, h * .52);
    ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    const d = Math.max(2, Math.round(s / 9));
    ctx.fillRect(Math.round(cx - w * .16), Math.round(cy - h * .16), d, d);
  }

  const magicColor = (i, now) => COLORS[1 + (Math.floor(now / 90) + i) % 6];

  function resize() {
    const well = $('well');
    const w = well.clientWidth - 14, h = well.clientHeight - 14;
    cell = Math.max(10, Math.floor(Math.min(w / COLS, h / ROWS)));
    const dpr = window.devicePixelRatio || 1;
    board.style.width = cell * COLS + 'px';
    board.style.height = cell * ROWS + 'px';
    board.width = cell * COLS * dpr;
    board.height = cell * ROWS * dpr;
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nextC.width = 60 * dpr; nextC.height = 50 * dpr;
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now()); drawNext();
  }

  function draw(now) {
    const W = cell * COLS, Hp = cell * ROWS;
    bctx.fillStyle = '#05040c'; bctx.fillRect(0, 0, W, Hp);
    bctx.strokeStyle = 'rgba(143,136,184,.08)'; bctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) { bctx.beginPath(); bctx.moveTo(c * cell + .5, 0); bctx.lineTo(c * cell + .5, Hp); bctx.stroke(); }
    for (let r = 1; r < ROWS; r++) { bctx.beginPath(); bctx.moveTo(0, r * cell + .5); bctx.lineTo(W, r * cell + .5); bctx.stroke(); }
    if (!grid) { drawDemo(); return; }

    const flashOn = state === 'clear' && Math.floor(clearTimer / 60) % 2 === 0;
    const clearing = new Set(clearCells.map(([r, c]) => r * COLS + c));
    for (let r = HIDDEN; r < H; r++)
      for (let c = 0; c < COLS; c++) {
        const v = grid[r][c];
        if (!v) continue;
        gem(bctx, c * cell, (r - HIDDEN) * cell, cell, clearing.has(r * COLS + c) && flashOn ? '#ffffff' : COLORS[v]);
      }

    if (piece && (state === 'play' || state.startsWith('pause'))) {
      const { x, c, magic } = piece;
      let gy = piece.y;
      while (!collide(x, gy + 1)) gy++;
      bctx.strokeStyle = magic ? '#ffffff' : COLORS[c[LEN - 1]]; bctx.globalAlpha = .45; bctx.lineWidth = 2;
      for (let i = 0; i < LEN; i++)
        if (gy + i >= HIDDEN) bctx.strokeRect(x * cell + 2, (gy + i - HIDDEN) * cell + 2, cell - 4, cell - 4);
      bctx.globalAlpha = 1;
      for (let i = 0; i < LEN; i++)
        if (piece.y + i >= HIDDEN) gem(bctx, x * cell, (piece.y + i - HIDDEN) * cell, cell, magic ? magicColor(i, now) : COLORS[c[i]]);
    }

    if (popup) {
      const a = Math.max(0, 1 - popup.t / 900);
      const fs = Math.max(12, Math.round(cell * .55));
      bctx.globalAlpha = a;
      bctx.font = `${fs}px "Press Start 2P", monospace`;
      bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
      const py = Hp * .4 - popup.t * .03;
      bctx.fillStyle = '#e8344e'; bctx.fillText(popup.text, W / 2 + 3, py + 3);
      bctx.fillStyle = '#ffcf3a'; bctx.fillText(popup.text, W / 2, py);
      bctx.globalAlpha = 1;
    }
  }

  // Title screen: a settled pile behind the overlay so the cabinet never looks empty
  const DEMO = ['..3...', '.24..1', '.4615.', '3156.2', '262315', '513642', '146253'];
  function drawDemo() {
    DEMO.forEach((row, i) => {
      const r = ROWS - DEMO.length + i;
      [...row].forEach((ch, c) => { const v = +ch; if (v) gem(bctx, c * cell, r * cell, cell, COLORS[v]); });
    });
  }

  function drawNext() {
    nctx.clearRect(0, 0, 60, 50);
    if (!next) return;
    const s = 16, ox = (60 - s) / 2, oy = (50 - s * LEN) / 2;
    const now = performance.now();
    next.c.forEach((v, i) => gem(nctx, ox, oy + i * s, s, next.magic ? magicColor(i, now) : COLORS[v]));
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (state === 'play') {
      const g = GRAVITY[Math.min(level - 1, GRAVITY.length - 1)];
      const interval = softDrop ? Math.min(g, 40) : g;
      dropTimer += dt;
      while (dropTimer >= interval && state === 'play') {
        dropTimer -= interval;
        if (!stepDown(softDrop)) { dropTimer = 0; break; }
      }
      if (state === 'play' && grounded()) {
        lockTimer += dt;
        if (lockTimer >= LOCK_MS) lock();
      }
      if (softDrop) updateHud();
    } else if (state === 'clear') {
      clearTimer += dt;
      if (clearTimer >= CLEAR_MS) finishClear();
    }
    if (popup && !state.startsWith('pause')) { popup.t += dt; if (popup.t > 900) popup = null; }
    draw(now);
    if (next && next.magic) drawNext();
    requestAnimationFrame(frame);
  }

  /* ---------- input: buttons ---------- */
  const repeaters = {};
  function startAct(act, el) {
    audioInit();
    el && el.classList.add('on');
    if (act === 'left' || act === 'right') {
      const dx = act === 'left' ? -1 : 1;
      move(dx);
      clearTimeout(repeaters[act]);
      const rep = () => { move(dx); repeaters[act] = setTimeout(rep, 70); };
      repeaters[act] = setTimeout(rep, 180);
    } else if (act === 'down') {
      softDrop = true;
    } else if (act === 'rotate') {
      rotate(1);
    } else if (act === 'drop') {
      hardDrop();
    }
  }
  function endAct(act, el) {
    el && el.classList.remove('on');
    clearTimeout(repeaters[act]); repeaters[act] = null;
    if (act === 'down') softDrop = false;
  }
  document.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); startAct(act, el); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, () => endAct(act, el)));
    el.addEventListener('contextmenu', e => e.preventDefault());
  });

  /* ---------- input: gestures on the screen ---------- */
  const screen = $('screen');
  let g = null;
  screen.addEventListener('pointerdown', e => {
    if (!overlay.hidden) return;
    audioInit();
    g = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false };
    screen.setPointerCapture?.(e.pointerId);
  });
  screen.addEventListener('pointermove', e => {
    if (!g || state !== 'play') return;
    const step = Math.max(22, cell * .8);
    while (e.clientX - g.lx >= step) { move(1); g.lx += step; g.moved = true; }
    while (g.lx - e.clientX >= step) { move(-1); g.lx -= step; g.moved = true; }
    while (e.clientY - g.ly >= step) { stepDown(true); g.ly += step; g.moved = true; updateHud(); }
  });
  screen.addEventListener('pointerup', e => {
    if (!g) return;
    const dt = performance.now() - g.t0, dy = e.clientY - g.y0, dx = Math.abs(e.clientX - g.x0);
    if (dy > 50 && dt < 220 && dy > dx * 1.5) hardDrop();
    else if (!g.moved && dt < 300) rotate(1);
    g = null;
  });
  screen.addEventListener('pointercancel', () => { g = null; });

  /* ---------- input: keyboard ---------- */
  const held = new Set();
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) e.preventDefault();
    if (k === 'c' || k === 'C' || k === '5') { insertCoin(); return; }
    if (state === 'title' || state === 'over') {
      if (k === 'Enter' || k === ' ' || k === '1') { if (splash) showTitle(); else newGame(); }
      return;
    }
    if (k === 'p' || k === 'P' || k === 'Escape') { pause(); return; }
    if (held.has(k)) return;
    held.add(k);
    if (k === 'ArrowLeft') startAct('left');
    else if (k === 'ArrowRight') startAct('right');
    else if (k === 'ArrowDown') startAct('down');
    else if (k === 'ArrowUp' || k === 'x' || k === 'X') rotate(1);
    else if (k === 'z' || k === 'Z') rotate(-1);
    else if (k === ' ') hardDrop();
  });
  document.addEventListener('keyup', e => {
    held.delete(e.key);
    if (e.key === 'ArrowLeft') endAct('left');
    else if (e.key === 'ArrowRight') endAct('right');
    else if (e.key === 'ArrowDown') endAct('down');
  });

  $('pauseBtn').addEventListener('click', pause);
  // Called by the Android app when it goes to the background or Back is pressed; returns true if it paused.
  window.__pauseGame = () => {
    if (state === 'play' || state === 'clear') { pause(); return true; }
    return false;
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'play' || state === 'clear')) pause(); });

  /* ---------- sound ---------- */
  let actx = null, master = null, soundOn = true;
  try { soundOn = localStorage.getItem('hexaArcadeSound') !== 'off'; } catch (e) {}
  const soundBtn = $('soundBtn');
  const paintSound = () => { soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.textContent = soundOn ? '♪' : '×'; };
  paintSound();
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; paintSound();
    try { localStorage.setItem('hexaArcadeSound', soundOn ? 'on' : 'off'); } catch (e) {}
    audioInit();
    if (master) master.gain.value = soundOn ? .5 : 0;
  });

  function audioInit() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
      master.connect(actx.destination);
    } catch (e) { actx = null; }
  }

  function tone(freq, start, dur, type = 'square', vol = .12) {
    if (!actx) return;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol, start);
    gn.gain.exponentialRampToValueAtTime(.0001, start + dur);
    o.connect(gn); gn.connect(master);
    o.start(start); o.stop(start + dur + .02);
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function sfx(kind) {
    if (!actx || !soundOn) return;
    const t = actx.currentTime;
    switch (kind) {
      case 'coin': tone(hz(83), t, .08, 'square', .1); tone(hz(88), t + .08, .35, 'square', .1); break;
      case 'move': tone(hz(84), t, .03, 'square', .04); break;
      case 'rotate': tone(hz(91), t, .04, 'triangle', .12); tone(hz(96), t + .03, .05, 'triangle', .08); break;
      case 'lock': tone(hz(48), t, .08, 'triangle', .2); break;
      case 'drop': tone(hz(60), t, .05, 'square', .1); tone(hz(43), t + .03, .12, 'triangle', .25); break;
      case 'clear': {
        // Each chain step plays higher
        const up = Math.min(chain - 1, 6) * 2;
        [72, 76, 79, 84].forEach((n, i) => tone(hz(n + up), t + i * .05, .1, 'square', .08));
        break;
      }
      case 'magic': [72, 76, 79, 84, 88, 91, 96, 100].forEach((n, i) => tone(hz(n), t + i * .04, .14, 'square', .08)); break;
      case 'level': [79, 84, 91].forEach((n, i) => tone(hz(n), t + i * .08, .16, 'square', .09)); break;
      case 'over': [67, 63, 60, 55, 48].forEach((n, i) => tone(hz(n), t + i * .16, .22, 'square', .1)); break;
    }
  }

  // Original chiptune loop in E minor, [midi, eighths]; 0 = rest
  const MELODY = [
    [64,1],[67,1],[71,2],[69,1],[67,1],[66,2],
    [64,1],[66,1],[67,1],[69,1],[71,4],
    [72,2],[71,1],[69,1],[67,2],[69,2],
    [71,2],[67,2],[64,4],
    [76,1],[74,1],[72,2],[71,1],[69,1],[67,2],
    [69,1],[71,1],[72,1],[74,1],[76,4],
    [74,2],[72,1],[71,1],[69,2],[66,2],
    [64,6],[0,2],
  ];
  const BASS = [40, 40, 36, 40, 45, 45, 38, 40]; // one root per bar
  let musicTimer = null, mIdx = 0, mTime = 0, bassEighth = 0;
  function eighth() { return Math.max(.1, .19 - (level - 1) * .006); }
  function musicStart() {
    if (!actx || musicTimer) return;
    mTime = actx.currentTime + .1;
    musicTimer = setInterval(() => {
      if (!soundOn) { mTime = actx.currentTime + .1; return; }
      while (mTime < actx.currentTime + .25) {
        const [n, len] = MELODY[mIdx];
        const e = eighth();
        if (n) tone(hz(n), mTime, len * e * .9, 'square', .05);
        for (let i = 0; i < len; i++) {
          const root = BASS[Math.floor(bassEighth / 8) % BASS.length];
          tone(hz(root + (bassEighth % 2 ? 12 : 0)), mTime + i * e, e * .8, 'triangle', .1);
          bassEighth = (bassEighth + 1) % (BASS.length * 8);
        }
        mTime += len * e;
        mIdx = (mIdx + 1) % MELODY.length;
      }
    }, 40);
  }
  function musicStop() { clearInterval(musicTimer); musicTimer = null; }

  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  let lock_ = null;
  async function wake() { try { lock_ = await navigator.wakeLock?.request('screen'); } catch (e) {} }

  // Splash title first, then the coin screen
  setTimeout(() => { if (splash) showTitle(); }, 2200);

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('well'));
  updateHud();
  resize();
  requestAnimationFrame(frame);
})();
</script>

</html>
