name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface the cause as an annotation (visible without opening the log)
            grep -A8 "What went wrong" build.log | tr '\n' ' ' | sed 's/^/::error title=Gradle::/' ; echo
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk HexaArcade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HexaArcade-apk
          path: HexaArcade.apk

      # A release gives the phone a plain download link
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 헥사 오락실 v1.${{ github.run_number }}
          files: HexaArcade.apk
          make_latest: true
